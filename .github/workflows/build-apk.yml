name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          pip install buildozer cython==3.0.3
      - name: Build
        working-directory: ${{ github.workspace }}
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          ls -la
          buildozer android debug 2>&1
        timeout-minutes: 90
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAC-M3U-PRO
          path: bin/*.apk
          retention-days: 30
